  keywords: 'GCMDSK:Earth Science > SPECTRAL/ENGINEERING > INFRARED WAVELENGTHS > REFLECTED INFRARED, GCMDSK:Earth Science > SPECTRAL/ENGINEERING > VISIBLE WAVELENGTHS > VISIBLE RADIANCE'
