# Sentinel 1
S1:
  summary: 'The SENTINEL-1 mission comprises a constellation of two polar-orbiting satellites, operating day and night performing C-band synthetic aperture radar imaging, enabling them to acquire imagery regardless of the weather.'
  related_information_type: 'Users guide'
  related_information_description: 'URI to a users guide or product manual for the dataset.'
  related_information_resource: 'https://sentinel.esa.int/web/sentinel/missions/sentinel-1'
  iso_topic_category: 'climatologyMeteorologyAtmosphere,oceans,imageryBaseMapsEarthCover'
  keywords: 'GCMDSK:Earth Science > Spectral/Engineering > RADAR > RADAR backscatter,GCMDSK:Earth Science > Spectral/Engineering > RADAR > RADAR imagery,GCMDSK:Earth Science > Spectral/Engineering > Microwave > Microwave imagery,GEMET:Orthoimagery,GEMET:Land cover,GEMET:Oceanographic geographical features'
  keywords_vocabulary: 'GCMDSK:GCMD Science Keywords:https://gcmd.earthdata.nasa.gov/kms/concepts/concept_scheme/sciencekeywords,GEMET:INSPIRE Themes:http://inspire.ec.europa.eu/theme'
  Conventions: 'CF-1.8,ACDD-1.3'

# Sentinel 2
S2:
